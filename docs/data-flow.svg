<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 598" width="680" height="598" role="img" font-family="ui-sans, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
<title>Token 数据流</title>
<desc>hub、GitHub、两台电脑与本地存储之间的 token 数据流关系（脱敏版）</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="598" rx="12" fill="#FAF8F5" stroke="#E5E1D8"/>
<rect x="40" y="60" width="160" height="280" rx="12" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="52" y="82" font-size="13" font-weight="500" fill="#1A1A1A">两台电脑</text>
<rect x="56" y="98" width="128" height="52" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="120" y="118" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#1A1A1A">电脑 A · widget</text>
<text x="120" y="136" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">读本地用量 → 上报</text>
<rect x="56" y="162" width="128" height="52" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="120" y="182" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#1A1A1A">电脑 B · widget</text>
<text x="120" y="200" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">读本地用量 → 上报</text>
<rect x="56" y="244" width="128" height="80" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="120" y="264" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#1A1A1A">本地存储</text>
<text x="120" y="282" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">AI 工具用量文件</text>
<text x="120" y="298" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">设置 + 加密密钥</text>
<text x="120" y="314" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">自动导出（可选）</text>
<rect x="250" y="100" width="140" height="160" rx="10" fill="#E6F1FB" stroke="#378ADD"/>
<text x="320" y="124" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="500" fill="#0C447C">Cloudflare Hub</text>
<text x="320" y="145" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">Worker + Durable Object</text>
<text x="320" y="161" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">SQLite 存各设备记录</text>
<text x="320" y="181" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">聚合：今日 / 本月 / 累计</text>
<text x="320" y="197" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">+ 日 / 月历史序列</text>
<text x="320" y="217" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">公开端点（免密钥）</text>
<text x="320" y="233" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">/api/history · SSE（密钥）</text>
<rect x="440" y="60" width="200" height="280" rx="12" fill="#E1F5EE" stroke="#5DCAA5"/>
<text x="452" y="82" font-size="13" font-weight="500" fill="#085041">GitHub</text>
<rect x="456" y="98" width="168" height="62" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="540" y="118" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">快照仓库（数据）</text>
<text x="540" y="135" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">Actions 每 15 分钟拉取</text>
<text x="540" y="151" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">→ token-monitor.json</text>
<rect x="456" y="178" width="168" height="78" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="540" y="198" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">站点仓库</text>
<text x="540" y="216" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">构建时读快照（API）</text>
<text x="540" y="232" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">+ 历史基线（每周）</text>
<text x="540" y="248" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">→ 静态导出</text>
<rect x="456" y="266" width="168" height="50" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="540" y="286" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">Pages CDN</text>
<text x="540" y="304" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">静态站点（含构建快照）</text>
<rect x="250" y="400" width="390" height="80" rx="10" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="266" y="424" dominant-baseline="central" font-size="13" font-weight="500" fill="#1A1A1A">访客浏览器</text>
<text x="266" y="447" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">首帧骨架 → 并行两路：hub 直拉（2 秒超时）｜ 仓库快照（3 秒超时）</text>
<text x="266" y="465" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">拉到即显：hub 成 → 实时值；败 → 仓库快照；再败 → 构建快照（各层标注数据时间）</text>
<path d="M200,126 L250,142" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<circle cx="225" cy="134" r="8" fill="#B4432E"/><text x="225" y="134" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#FFFFFF">1</text>
<path d="M250,222 L200,232" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<circle cx="225" cy="227" r="8" fill="#B4432E"/><text x="225" y="227" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#FFFFFF">2</text>
<path d="M120,214 L120,244" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#ar)"/>
<circle cx="120" cy="229" r="8" fill="#B4432E"/><text x="120" y="229" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#FFFFFF">3</text>
<path d="M390,140 L456,122" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<circle cx="423" cy="131" r="8" fill="#B4432E"/><text x="423" y="131" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#FFFFFF">4</text>
<path d="M540,160 L540,178" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<circle cx="540" cy="169" r="8" fill="#B4432E"/><text x="540" y="169" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#FFFFFF">5</text>
<path d="M390,212 L456,208" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<circle cx="423" cy="210" r="8" fill="#B4432E"/><text x="423" y="210" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#FFFFFF">6</text>
<path d="M184,280 L420,280 L420,238 L456,238" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<circle cx="300" cy="280" r="8" fill="#B4432E"/><text x="300" y="280" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#FFFFFF">7</text>
<path d="M624,129 L634,129 L634,384 L630,400" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<circle cx="634" cy="300" r="8" fill="#B4432E"/><text x="634" y="300" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#FFFFFF">8</text>
<path d="M320,260 L320,400" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<circle cx="320" cy="330" r="8" fill="#B4432E"/><text x="320" y="330" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#FFFFFF">9</text>
<path d="M540,316 L540,400" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<circle cx="540" cy="358" r="8" fill="#B4432E"/><text x="540" y="358" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#FFFFFF">10</text>
<line x1="40" y1="488" x2="640" y2="488" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="40" y="506" dominant-baseline="central" font-size="12" font-weight="500" fill="#1A1A1A">流向说明</text>
<text x="640" y="506" text-anchor="end" dominant-baseline="central" font-size="11" fill="#888780">实线 = 网络数据流 · 虚线 = 本地读取</text>
<circle cx="47" cy="526" r="7" fill="#B4432E"/><text x="47" y="526" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="500" fill="#FFFFFF">1</text>
<text x="60" y="526" dominant-baseline="central" font-size="11" fill="#444441">两台 widget 实时上报 hub（ingest）</text>
<circle cx="47" cy="544" r="7" fill="#B4432E"/><text x="47" y="544" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="500" fill="#FFFFFF">2</text>
<text x="60" y="544" dominant-baseline="central" font-size="11" fill="#444441">hub 经 SSE 把聚合结果推回两台 widget</text>
<circle cx="47" cy="562" r="7" fill="#B4432E"/><text x="47" y="562" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="500" fill="#FFFFFF">3</text>
<text x="60" y="562" dominant-baseline="central" font-size="11" fill="#444441">widget 读取本机 AI 工具用量文件（本地）</text>
<circle cx="47" cy="580" r="7" fill="#B4432E"/><text x="47" y="580" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="500" fill="#FFFFFF">4</text>
<text x="60" y="580" dominant-baseline="central" font-size="11" fill="#444441">Actions 每 15 分钟拉 hub 公开端点（免密钥）</text>
<circle cx="360" cy="526" r="7" fill="#B4432E"/><text x="360" y="526" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="500" fill="#FFFFFF">5</text>
<text x="373" y="526" dominant-baseline="central" font-size="11" fill="#444441">站点构建优先读快照仓库（Contents API）</text>
<circle cx="360" cy="544" r="7" fill="#B4432E"/><text x="360" y="544" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="500" fill="#FFFFFF">6</text>
<text x="373" y="544" dominant-baseline="central" font-size="11" fill="#444441">构建兜底：构建机直连 hub 公开端点</text>
<circle cx="360" cy="562" r="7" fill="#B4432E"/><text x="360" y="562" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="500" fill="#FFFFFF">7</text>
<text x="373" y="562" dominant-baseline="central" font-size="11" fill="#444441">本机每周导出全量历史（带密钥）→ 站点仓库</text>
<circle cx="360" cy="580" r="7" fill="#B4432E"/><text x="360" y="580" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="500" fill="#FFFFFF">8</text>
<text x="373" y="580" dominant-baseline="central" font-size="11" fill="#444441">访客兜底：经国内代理读快照仓库（无缓存）</text>
<circle cx="540" cy="526" r="7" fill="#B4432E"/><text x="540" y="526" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="500" fill="#FFFFFF">9</text>
<text x="553" y="526" dominant-baseline="central" font-size="11" fill="#444441">访客并行直拉 hub（2 秒超时）</text>
<circle cx="540" cy="544" r="7" fill="#B4432E"/><text x="540" y="544" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="500" fill="#FFFFFF">10</text>
<text x="553" y="544" dominant-baseline="central" font-size="11" fill="#444441">Pages CDN 下发静态页（内嵌构建快照）</text>
</svg>
